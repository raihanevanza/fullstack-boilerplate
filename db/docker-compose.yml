# SQL Server 2022 for local development.
#
# The image is published for linux/amd64 only. On Apple Silicon it runs under
# emulation: enable Rosetta in Docker Desktop (Settings > General > "Use Rosetta
# for x86_64/amd64 emulation") or start Colima with
#   colima start --vm-type vz --vz-rosetta --cpu 2 --memory 4
name: boilerplate-db

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: boilerplate-mssql
    restart: unless-stopped
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in db/.env}
      TZ: UTC
    ports:
      - '${MSSQL_PORT:-1433}:1433'
    volumes:
      - mssql-data:/var/opt/mssql
      - ./init:/init:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q ''SELECT 1'' -b -o /dev/null',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  mssql-data:
